name: Unit tests

on:
  push:
    branches: [main, dev]
    paths:
      - app/**
      - tests/**
      - requirements.txt
      - .github/workflows/test.yml
  pull_request:
    paths:
      - app/**
      - tests/**
      - requirements.txt
      - .github/workflows/test.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run builder tests
        run: PYTHONPATH=. python tests/test_builders.py
