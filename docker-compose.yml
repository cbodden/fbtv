services:
  fbtv:
    # Default: stable from main. For pre-release: ghcr.io/cbodden/fbtv:dev
    image: ghcr.io/cbodden/fbtv:latest
    pull_policy: always
    container_name: fbtv
    restart: unless-stopped
    ports:
      - "${PORT:-7777}:7777"
    # Optional env pass-through. Portainer: prefer config/credentials.env with
    # FUBO_PASS_B64 (no quotes). File wins over these variables.
    environment:
      - FUBO_USER
      - FUBO_PASS
      - FUBO_PASS_B64
      - HOST=0.0.0.0
      - PORT=7777
      - CONFIG_DIR=/app/config
      - EPG_CACHE_SECONDS=${EPG_CACHE_SECONDS:-3600}
      - EPG_EMPTY_CACHE_SECONDS=${EPG_EMPTY_CACHE_SECONDS:-120}
      - EPG_DAYS=${EPG_DAYS:-2}
      - DRM_SCAN_ON_START=${DRM_SCAN_ON_START:-true}
      - DRM_SCAN_CONCURRENCY=${DRM_SCAN_CONCURRENCY:-1}
      - DRM_SCAN_DELAY_MS=${DRM_SCAN_DELAY_MS:-750}
      - DRM_SCAN_MAX_AGE_HOURS=${DRM_SCAN_MAX_AGE_HOURS:-24}
      - DRM_SCAN_INTERVAL_HOURS=${DRM_SCAN_INTERVAL_HOURS:-24}
      - STREAM_PROXY=${STREAM_PROXY:-false}
      - STREAM_PROXY_MAX=${STREAM_PROXY_MAX:-3}
      - FFMPEG_PATH=${FFMPEG_PATH:-ffmpeg}
    volumes:
      - ./config:/app/config
