services:
  fbtv:
    build: .
    image: fbtv
    container_name: fbtv
    restart: unless-stopped
    ports:
      - "${PORT:-7777}:7777"
    environment:
      FUBO_USER: ${FUBO_USER}
      FUBO_PASS: ${FUBO_PASS}
      HOST: 0.0.0.0
      PORT: 7777
      CONFIG_DIR: /app/config
      EPG_CACHE_SECONDS: ${EPG_CACHE_SECONDS:-3600}
      EPG_DAYS: ${EPG_DAYS:-2}
    volumes:
      - ./config:/app/config
    env_file:
      - .env
